<div class="scroll hn-scroll">
  <header>
    <div class="logo-badge">
      <img src="assets/hornerito-bird.svg" alt="Hornerito" />
    </div>
    <div class="brand">Hornerito</div>
    <div class="tagline">Recuperación de contraseña</div>
  </header>

  <div class="body">
    <h1 class="hn-head">Recuperar contraseña</h1>
    <p class="lead">Ingresá tu correo para recibir un enlace de restablecimiento.</p>

    @if (successMsg()) {
      <div class="banner banner--success">
        <div class="ico">✉️</div>
        <div>
          <div class="banner-title">Solicitud enviada</div>
          <div class="banner-text">{{ successMsg() }}</div>
        </div>
      </div>

      <button class="hn-btn hn-btn--primary hn-btn--block cta" type="button" (click)="goLogin()">
        Volver al inicio de sesión
      </button>
    } @else {
      @if (submitErr()) {
        <div class="banner banner--error">
          <div class="ico">⚠️</div>
          <div class="banner-error-text">{{ submitErr() }}</div>
        </div>
      }

      <label class="hn-label" for="email">Correo electrónico</label>
      <input
        id="email"
        class="hn-input mb-lg"
        type="email"
        inputmode="email"
        autocomplete="off"
        placeholder="vos@ejemplo.com"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
        (keyup.enter)="submit()"
      />

      <button
        class="hn-btn hn-btn--primary hn-btn--block cta"
        type="button"
        [disabled]="loading()"
        (click)="submit()"
      >
        {{ loading() ? 'Enviando...' : 'Enviar' }}
      </button>

      <div class="switch">
        <span (click)="goLogin()">Volver a Iniciar sesión</span>
      </div>
    }
  </div>
</div>
