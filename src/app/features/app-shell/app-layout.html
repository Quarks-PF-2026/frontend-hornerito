<hn-top-bar [kicker]="meta().kicker" [title]="meta().title" />

<div class="content hn-scroll">
  <router-outlet />
</div>

@if (showFab()) {
  <button class="fab" type="button" (click)="fab()">
    <span class="plus">+</span>{{ meta().fab }}
  </button>
}

<!-- El donante solo entra a /app por Mi Perfil: sin menú, la página ocupa todo
     y trae su propio "Volver al inicio" y "Cerrar sesión". -->
@if (hasPanelAccess()) {
  <hn-bottom-nav
    [currentTab]="tab()"
    [canManageMembers]="canManageMembers()"
    [canWriteContent]="canWriteContent()"
    [isPlatformAdmin]="isPlatformAdmin()"
    [canOperate]="canOperate()"
    [hasPanelAccess]="hasPanelAccess()"
    (logout)="logout()"
  />
}
<app-modal-host />
<hn-toast />
